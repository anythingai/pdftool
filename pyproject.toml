[project]
name = "pdftool"
version = "0.1.0"
description = "PDF → Markdown (Azure OCR) converter"
authors = [{ name = "jd316" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi==0.115.5",
  "uvicorn[standard]==0.32.0",
  "python-multipart==0.0.9",
  "pypdf==5.1.0",
  "requests==2.31.0",
  "python-dotenv==1.0.0",
  "Pillow==12.0.0",
]

[project.scripts]
pdftool = "pdftool.cli:cli"

[tool.setuptools.packages.find]
include = ["pdftool*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
